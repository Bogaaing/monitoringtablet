<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Purple Gradient for App Icon -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6D5DFE" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6D5DFE" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Icon -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>

    <!-- Dotted Pattern Top-Right & Bottom-Left -->
    <pattern id="dotPattern" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="#4F46E5" opacity="0.06" />
    </pattern>

    <!-- Mask for Top Right Dots -->
    <radialGradient id="topRightMask" cx="100%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Mask for Bottom Left Dots -->
    <radialGradient id="bottomLeftMask" cx="0%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <font-face font-family="Plus Jakarta Sans">
      <font-face-src>
        <font-face-name name="Plus Jakarta Sans Bold"/>
      </font-face-src>
    </font-face>
  </defs>

  <!-- Canvas Background (Pure White #FFFFFF) -->
  <rect width="1080" height="1920" fill="#FFFFFF" />

  <!-- Background Decorations: Top-Right Dotted Pattern (Opacity ~6%) -->
  <rect x="540" y="0" width="540" height="540" fill="url(#dotPattern)" mask="url(#topRightMask)" />

  <!-- Background Decorations: Bottom-Left Dotted Pattern (Opacity ~6%) -->
  <rect x="0" y="1380" width="540" height="540" fill="url(#dotPattern)" mask="url(#bottomLeftMask)" />

  <!-- Background Decorations: Top-Left Thin Abstract Circles (Opacity ~6%) -->
  <circle cx="-50" cy="-50" r="420" fill="none" stroke="#4F46E5" stroke-width="3" opacity="0.06" />
  <circle cx="-50" cy="-50" r="300" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="12 12" opacity="0.06" />

  <!-- Background Decorations: Bottom-Right Thin Abstract Circles (Opacity ~6%) -->
  <circle cx="1130" cy="1970" r="500" fill="none" stroke="#4F46E5" stroke-width="3" opacity="0.06" />
  <circle cx="1130" cy="1970" r="380" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="12 12" opacity="0.06" />

  <!-- Center Group -->
  <g transform="translate(540, 960)">

    <!-- Application Icon (Centered at Y = -180) -->
    <!-- Size: 220x220 in 1080px canvas (scaled 2x for high-res vector canvas) -->
    <g transform="translate(-110, -290)" filter="url(#purpleGlow)">
      <rect width="220" height="220" rx="54" ry="54" fill="url(#iconGradient)" />
      
      <!-- White Tablet Icon Centered -->
      <g transform="translate(50, 50) scale(5)" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="4" y="2" width="16" height="20" rx="2" ry="2" />
        <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5" />
      </g>
    </g>

    <!-- Title Typography (Y = 30) -->
    <!-- Font Size: 120px in 1080 canvas equivalent to 60px in standard 540 canvas -->
    <text y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="120" font-weight="800" letter-spacing="-3">
      <tspan fill="#1F2937">Tab</tspan><tspan fill="#4F46E5">Monitor</tspan>
    </text>

    <!-- Short Centered Purple Divider Line (Width 80px in 1080 canvas = 40px equivalent) -->
    <rect x="-40" y="80" width="80" height="7" rx="3.5" fill="#4F46E5" />

    <!-- Modern Thin Rounded Progress Bar (Width 440px in 1080 canvas = 220px equivalent) -->
    <!-- Track: #ECECFF -->
    <rect x="-220" y="160" width="440" height="9" rx="4.5" fill="#ECECFF" />
    <!-- Active Indicator Bar -->
    <rect x="-220" y="160" width="260" height="9" rx="4.5" fill="url(#progressGradient)" />

    <!-- Loading Text: "Memuat aplikasi..." (Font Size 36px in 1080 canvas = 18px equivalent) -->
    <text y="235" text-anchor="middle" fill="#6B7280" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="36" font-weight="500" letter-spacing="-0.5">
      Memuat aplikasi...
    </text>

  </g>
</svg>

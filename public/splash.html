<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TabMonitor — PWA Splash Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFFFF;
      --charcoal: #1F2937;
      --primary-purple: #4F46E5;
      --purple-gradient-end: #6D5DFE;
      --track-color: #ECECFF;
      --text-muted: #6B7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container replicating 1080x1920 canvas ratio cleanly */
    .splash-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 853px; /* Aspect 9:16 portrait */
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
    }

    /* Background Decorations (Ultra subtle 5-8% opacity) */
    .bg-decor {
      position: absolute;
      pointer-events: none;
      opacity: 0.06;
    }

    /* Top-right subtle dotted pattern */
    .dots-top-right {
      top: 0;
      right: 0;
      width: 240px;
      height: 240px;
      background-image: radial-gradient(#4F46E5 2px, transparent 2px);
      background-size: 16px 16px;
      mask-image: radial-gradient(circle at top right, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at top right, black 30%, transparent 80%);
    }

    /* Bottom-left subtle dotted pattern */
    .dots-bottom-left {
      bottom: 0;
      left: 0;
      width: 240px;
      height: 240px;
      background-image: radial-gradient(#4F46E5 2px, transparent 2px);
      background-size: 16px 16px;
      mask-image: radial-gradient(circle at bottom left, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at bottom left, black 30%, transparent 80%);
    }

    /* Top-left subtle circular line decoration */
    .circle-top-left {
      top: -80px;
      left: -80px;
      width: 280px;
      height: 280px;
      border: 1.5px solid #4F46E5;
      border-radius: 50%;
    }

    .circle-top-left-inner {
      top: -40px;
      left: -40px;
      width: 200px;
      height: 200px;
      border: 1px dashed #4F46E5;
      border-radius: 50%;
    }

    /* Bottom-right subtle circular line decoration */
    .circle-bottom-right {
      bottom: -100px;
      right: -100px;
      width: 320px;
      height: 320px;
      border: 1.5px solid #4F46E5;
      border-radius: 50%;
    }

    .circle-bottom-right-inner {
      bottom: -60px;
      right: -60px;
      width: 240px;
      height: 240px;
      border: 1px dashed #4F46E5;
      border-radius: 50%;
    }

    /* Center Content Stack */
    .center-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    /* App Icon */
    .app-icon {
      width: 104px;
      height: 104px;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--primary-purple) 0%, var(--purple-gradient-end) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 14px 28px rgba(79, 70, 229, 0.22),
        0 6px 12px rgba(109, 93, 254, 0.15);
      margin-bottom: 40px; /* 40px exact spacing */
      transition: transform 0.3s ease;
    }

    .app-icon svg {
      width: 52px;
      height: 52px;
      color: #FFFFFF;
    }

    /* Title Typography */
    .title {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 16px;
      user-select: none;
    }

    .title .tab {
      color: var(--charcoal);
    }

    .title .monitor {
      color: var(--primary-purple);
    }

    /* Short centered purple divider line */
    .divider {
      width: 40px;
      height: 3.5px;
      background-color: var(--primary-purple);
      border-radius: 4px;
      margin-bottom: 36px;
    }

    /* Modern thin rounded progress bar */
    .progress-container {
      width: 220px;
      height: 4px;
      background-color: var(--track-color);
      border-radius: 100px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-purple) 0%, var(--purple-gradient-end) 100%);
      border-radius: 100px;
      animation: loadProgress 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loadProgress {
      0% {
        left: -35%;
        width: 35%;
      }
      60% {
        left: 35%;
        width: 65%;
      }
      100% {
        left: 100%;
        width: 25%;
      }
    }

    /* Loading status text */
    .loading-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <!-- Subtle Background Decorations -->
    <div class="bg-decor dots-top-right"></div>
    <div class="bg-decor dots-bottom-left"></div>
    <div class="bg-decor circle-top-left"></div>
    <div class="bg-decor circle-top-left circle-top-left-inner"></div>
    <div class="bg-decor circle-bottom-right"></div>
    <div class="bg-decor circle-bottom-right circle-bottom-right-inner"></div>

    <!-- Center Content -->
    <div class="center-content">
      <!-- 104px Rounded Square App Icon with Purple Gradient & Tablet Icon -->
      <div class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="3"></line>
        </svg>
      </div>

      <!-- Title: Tab (Charcoal) Monitor (Purple) 58px -->
      <h1 class="title">
        <span class="tab">Tab</span><span class="monitor">Monitor</span>
      </h1>

      <!-- Short centered purple divider line (40px) -->
      <div class="divider"></div>

      <!-- Modern thin rounded progress bar (220px, primary #4F46E5, track #ECECFF) -->
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>

      <!-- Status Text -->
      <p class="loading-text">Memuat aplikasi...</p>
    </div>
  </div>

</body>
</html>
